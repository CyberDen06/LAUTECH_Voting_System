<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <!-- Outer circle background -->
  <circle cx="60" cy="60" r="55" fill="none" stroke="#f4da8a" stroke-width="2" opacity="0.8"/>
  
  <!-- Inner geometric shape -->
  <g transform="translate(60, 60)">
    <!-- Triangle (L for LAUTECH) -->
    <path d="M 0,-35 L -25,25 L 25,25 Z" fill="#f4da8a" opacity="0.9"/>
    
    <!-- Central square -->
    <rect x="-12" y="-12" width="24" height="24" fill="none" stroke="#f4da8a" stroke-width="1.5" opacity="0.7"/>
    
    <!-- Accent circle -->
    <circle cx="0" cy="0" r="8" fill="#f4da8a" opacity="0.6"/>
  </g>
  
  <!-- Institution name text -->
  <text x="110" y="45" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#f4da8a" letter-spacing="1">
    LAUTECH
  </text>
  
  <!-- Subtitle text -->
  <text x="110" y="65" font-family="Arial, sans-serif" font-size="11" fill="#d7d7d7" letter-spacing="0.5">
    JUPEB AWARDS
  </text>
  
  <!-- Decorative line -->
  <line x1="105" y1="72" x2="195" y2="72" stroke="#f4da8a" stroke-width="1" opacity="0.5"/>
</svg>